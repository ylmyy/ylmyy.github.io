<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弹性布局焦点图</title>
    <style>
        ul,li{
    margin: 0;
    padding: 0;
    list-style: none;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
        }
        .banner {
            width: 100%;
            max-width: 1200px;
            margin: 50px auto;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        .banner-img {
            flex: 1;
        }
        .banner-img img {
            width: 100%;
            display: block;
        }
        .arrow{
            width: 60px;
            height: 60px;
            background: rgba(64, 166, 176, 0.7);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        .point {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .point li {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
        }
        .point li img{
            width:100%;
            height:100%;
        }
        .point li.active img{
            background:ur1("point2.png");
        }
    </style>
</head>
<body>
    <div class="banner">
        <button class="arrow prev">
            <img src="arrow2(1).png"alt="左切换">
        </button>
        <div class="banner-img">
            <img src="banner1.jpg" alt="地球日海报">
        </div>
        <button class="arrow next">
            <img src="arrow3.png"alt="右切换">
        </button>
        <ul class="point">
            <li><img src="point1.png"></li>
            <li class="active"><img src="point2.png"></li>
            <li><img src="point1.png"></li> 
            <li><img src="point1.png"></li>
        </ul>
    </div>
</body>
</html>
