<body>
    <div class="wrapper">
        <div class="img-box">
            <img src="微信图片_20260506191927_307_24.jpg" alt="态度决定一切 细节决定成败">
        </div>
        <div class="text-box">
            <h3>如何培养<span class="blue-text">认真严谨</span>的习惯</h3>
            <div class="meta-info">
                时间:2022年02月21日17时26分 来源:思想教育
            </div>
            <ul>
                <li><span class="red-text">反复确认</span>，做任何事情都要照顾到每一个细节并反复确认，<span class="red-text">要有一种能在脑子里“虚拟”整个事件过程的能力，确保所有的节点都正常</span>。</li>
                <li>想尽办法<span class="red-text">努力让不可能变为可能</span>只有用全力去做了，才算是努力。</li>
                <li>结果导向<span class="red-text">一切以结果为导向，任何事情都是你的名片</span>，还要思考你的结果和过程是否满足所有和你配合的人的需求。</li>
                <li>学会假设<span class="red-text">了解周围比你强的人，观察他们的做事方法</span>。遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做。</li>
            </ul>
        </div>
    </div>
