<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网上书城-用户注册</title>
    <style>
        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
        }
        .top-bar {
            width: 420px;
            height: 40px;
            background: #888888;
            color: #fff;
            text-align: center;
            line-height: 40px;
            font-size: 18px;
        }
        .register-box {
            width: 400px;
            background: #e8e8e8;
            padding: 20px 10px;
        }
        .reg-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .form-item {
            margin: 12px auto;
            width: 280px;
            display: flex;
            align-items: center;
        }
        .form-item input {
            flex: 1;
            height: 22px;
            margin-left: 8px;
        }
        .submit-btn {
            width: 280px;
            height: 28px;
            background: #888888;
            color: #fff;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">网上书城</div>
    <div class="register-box">
        <div class="reg-title">➕ 注册新用户</div>
        <form>
            <div class="form-item">
                <label>👤用户名</label>
                <input type="text" name="username">
            </div>
            <div class="form-item">
                <label>🔒密码</label>
                <input type="password" name="pwd">
            </div>
            <div class="form-item">
                <label>🔒确认密码</label>
                <input type="password" name="repwd">
            </div>
            <div class="form-item">
                <label>📁电子邮件</label>
                <input type="email" name="email">
            </div>
            <div class="form-item">
                <input type="submit" value="注册新用户" class="submit-btn">
            </div>
        </form>
    </div>
</body>
</html>
