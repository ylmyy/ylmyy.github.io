<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第三章作业</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #5544b8 0%, #d8a8d8 100%);
    }

    .player-card {
      width: 300px;
      height: 300px;
      background: #d568bb;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 30px rgba(216, 139, 197, 0.2);
    }


    .player-box {
      width: 250px;
      height: 180px;
      background: linear-gradient(135deg, #b5efb1 0%, #b35980 100%);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 10px solid #2b1b2b;
    }

    .play-btn {
      width: 100px;
      height: 100px;
      background: rgb(201, 198, 240);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .play-icon {
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 30px solid #8e658e;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="player-box">
      <div class="play-btn">
        <div class="play-icon"></div>
      </div>
    </div>
  </div>
</body>
</html>
